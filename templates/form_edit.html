{% extends 'layout.html' %}

{% block content %}
<h2>Editar livro</h2>
{% if error %}
  <p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="{{ url_for('edit_book', isbn=livro.isbn) }}">
  <p><strong>ISBN:</strong> {{ livro.isbn }}</p>
  <label>Título:<br><input name="titulo" value="{{ livro.titulo }}" required></label><br>
  <label>Autor:<br><input name="autor" value="{{ livro.autor }}"></label><br>
  <label>Gênero:<br><input name="genero" value="{{ livro.genero }}"></label><br>
  <label>Ano de Publicação:<br><input name="ano_publicacao" value="{{ livro.ano_publicacao }}"></label><br>
  <label>Editora:<br><input name="editora" value="{{ livro.editora }}"></label><br>
  <label>Páginas:<br><input name="paginas" value="{{ livro.paginas }}"></label><br>
  <label>Localização:<br><input name="localizacao" value="{{ livro.localizacao }}"></label><br>
  <label>Status:<br>
    <select name="status">
      <option value="disponivel" {% if livro.status == 'disponivel' %}selected{% endif %}>Disponível</option>
      <option value="emprestado" {% if livro.status == 'emprestado' %}selected{% endif %}>Emprestado</option>
    </select>
  </label>
  <br><br>
  <button type="submit">Salvar alterações</button>
</form>

<p><a href="{{ url_for('index') }}">Voltar à lista</a></p>
{% endblock %}
