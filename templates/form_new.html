{% extends 'layout.html' %}

{% block content %}
<h2>Cadastrar novo livro</h2>
{% if error %}
  <p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="{{ url_for('new_book') }}">
  <label>ISBN:<br><input name="isbn" value="{{ dados.get('isbn','') }}" required></label><br>
  <label>Título:<br><input name="titulo" value="{{ dados.get('titulo','') }}" required></label><br>
  <label>Autor:<br><input name="autor" value="{{ dados.get('autor','') }}"></label><br>
  <label>Gênero:<br><input name="genero" value="{{ dados.get('genero','') }}"></label><br>
  <label>Ano de Publicação:<br><input name="ano_publicacao" value="{{ dados.get('ano_publicacao','') }}"></label><br>
  <label>Editora:<br><input name="editora" value="{{ dados.get('editora','') }}"></label><br>
  <label>Páginas:<br><input name="paginas" value="{{ dados.get('paginas','') }}"></label><br>
  <label>Localização:<br><input name="localizacao" value="{{ dados.get('localizacao','') }}"></label><br>
  <br>
  <button type="submit">Salvar</button>
</form>

<p><a href="{{ url_for('index') }}">Voltar à lista</a></p>
{% endblock %}
